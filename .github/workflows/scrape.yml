name: Scraper La Libreta

on:
  schedule:
    # Horario pedido: 00:15, 12:00, 15:00, 18:00 y 22:00, hora peninsular española,
    # más una ejecución extra a las 01:15 pensada específicamente para no tener que
    # tocar este archivo cuando llegue el horario de invierno (ver explicación abajo).
    #
    # GitHub Actions solo programa en UTC. Con horario de verano (CEST, UTC+2),
    # que es el vigente ahora mismo, estas horas UTC equivalen a:
    #   22:15 UTC -> 00:15 CEST (del día siguiente)
    #   23:15 UTC -> 01:15 CEST (del día siguiente)   <- la hora "extra"
    #   10:00 UTC -> 12:00 CEST
    #   13:00 UTC -> 15:00 CEST
    #   16:00 UTC -> 18:00 CEST
    #   20:00 UTC -> 22:00 CEST
    #
    # Cuando España pase a horario de invierno (CET, UTC+1) a finales de octubre,
    # estas MISMAS horas UTC pasan a caer una hora más tarde en local:
    #   22:15 UTC -> 23:15 CET
    #   23:15 UTC -> 00:15 CET   <- ahora es esta la que hace de "00:15 local"
    #   10:00 UTC -> 11:00 CET
    #   13:00 UTC -> 14:00 CET
    #   16:00 UTC -> 17:00 CET
    #   20:00 UTC -> 21:00 CET
    # Es decir: al tener ya programadas tanto las 22:15 como las 23:15 UTC, siempre
    # habrá una ejecución cerca de medianoche en local, pase lo que pase con el
    # cambio de hora, sin tener que editar este archivo dos veces al año. Las otras
    # cuatro horas sí se desplazarán una hora en local durante el horario de
    # invierno (11:00/14:00/17:00/21:00 en vez de 12:00/15:00/18:00/22:00); avísame
    # cuando se acerque el cambio si quieres que las ajuste también.
    - cron: "15 22 * * *"
    - cron: "15 23 * * *"
    - cron: "0 10,13,16,20 * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Ejecutar en modo prueba (no escribe en Firestore)"
        type: boolean
        default: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Instalar dependencias
        run: npm install --omit=dev

      - name: Ejecutar scraper
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          DRY_RUN: ${{ github.event.inputs.dry_run == 'true' && '1' || '0' }}
        run: npm run scrape
