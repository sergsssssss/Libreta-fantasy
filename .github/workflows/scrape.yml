name: Scraper La Libreta

on:
  schedule:
    # Cada 6 horas (hora UTC). LaLiga Fantasy suele actualizar mercado y
    # probabilidades varias veces al día; ajusta la frecuencia si hace falta.
    - cron: "0 */6 * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Ejecutar en modo prueba (no escribe en Firestore)"
        type: boolean
        default: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Instalar dependencias
        run: npm install --omit=dev

      - name: Ejecutar scraper
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          DRY_RUN: ${{ github.event.inputs.dry_run == 'true' && '1' || '0' }}
        run: npm run scrape
